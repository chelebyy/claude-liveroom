name: Feature request
description: Something the pane could show, or show better.
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What you'd like to see
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it helps
      description: The situation where you'd use it.
  - type: textarea
    id: source
    attributes:
      label: Where the data would come from
      description: If you know which session event or `$` call carries it. Liveroom shows only what real session events give it.
